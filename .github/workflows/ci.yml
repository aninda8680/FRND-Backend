name: CI & Core Architecture Tests

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api:
    name: API Service Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API Dependencies
        run: |
          cd api
          npm ci

      - name: Verify JavaScript Syntax & Core Architecture
        run: |
          node --check api/server.js
          node --check api/routes/admin.js
          node --check api/routes/social.js
          node --check api/routes/verification.js
          node --check api/utils/redis.js
          node --check api/utils/uploader.js
          node api/tests/smoke.test.js

      - name: Run Integration Unit Test Suite
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/frnd_test_db
          JWT_SECRET: ci-test-secret-key-32-chars-minimum
          INTERNAL_NOTIFY_SECRET: ci-internal-secret
        run: |
          cd api
          npm test

  test-chat:
    name: Chat Service Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chat/package-lock.json

      - name: Install Chat Dependencies
        run: |
          cd chat
          npm ci

      - name: Verify Chat Service Syntax & DB Connection
        run: |
          node --check chat/server.js
          node --check chat/utils/db.js
          node --check chat/utils/redis.js

      - name: Run Chat Test Suite
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/frnd_chat_test_db
          JWT_SECRET: ci-test-secret-key-32-chars-minimum
        run: |
          cd chat
          npm test --if-present
